<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GR Events Sistem</title>
<meta name="description" content="Sistema interno da GR Events: eventos, equipe, orçamentos e caixa.">
<meta name="theme-color" content="#D45A20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GR Events">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: ferramenta de trabalho de uma produtora de eventos — direta, calma, com a marca presente.
   IDEA: a prancheta de produção: cards creme sobre papel, etiquetas laranja como fita de marcação.
   PICTURE: o próprio sistema — listas, cards de evento, calendário e organograma são a imagem.
   COLOUR and TYPE: creme #F7F3ED, papel #FFFDF9, laranja GR #D45A20, preto #1C1713; Manrope.
   LAYOUT: menu escuro fixo à esquerda, área de trabalho até 1240px; no celular o menu vira gaveta. */
:root{color-scheme:light;--bg:#F7F3ED;--paper:#FFFDF9;--ink:#1C1713;--muted:#6B6258;--line:#E4D8C5;--line2:#D6C7B0;--or:#D45A20;--or2:#B04716;--orl:#F8E2D5;--side:#1C1713;--side2:#2A231D;--ok:#2F7D4F;--okl:#E2F1E7;--bad:#B3392B;--badl:#FBE6E3;--warn:#A86B00;--warnl:#FBF0D6;--sh:0 1px 2px rgba(40,25,10,.06),0 4px 14px rgba(40,25,10,.06)}
:root[data-theme=dark],:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance}
h1,h2,.logo,.kpi .v,.hero h2{font-family:Archivo,Manrope,system-ui,sans-serif;letter-spacing:-.02em}
h1{font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-.01em}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:var(--or2)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,[contenteditable]:focus{outline:2px solid var(--or);outline-offset:1px}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--or);padding:0}
input[type=file]{padding:8px}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f>span{white-space:nowrap}
.pwbox{position:relative}.pwbox input{padding-right:48px}.pwbox .ib{position:absolute;right:3px;top:50%;transform:translateY(-50%)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--paper);cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--or);border-color:var(--or);color:#fff}.btn.pri:hover{background:var(--or2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:rgba(0,0,0,.05)}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.ib{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);flex:none}
.ib:hover{background:rgba(0,0,0,.06);color:var(--ink)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.kp{grid-template-columns:repeat(auto-fit,minmax(min(100%,228px),1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--sh)}
.muted{color:var(--muted)}.small{font-size:13px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nw{white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#EFE6D8;color:var(--ink);white-space:nowrap;border:0;cursor:default}
.tag.or{background:var(--orl);color:var(--or2)}.tag.ok{background:var(--okl);color:var(--ok)}.tag.bad{background:var(--badl);color:var(--bad)}.tag.warn{background:var(--warnl);color:var(--warn)}.tag.dark{background:var(--ink);color:#fff}
button.tag{cursor:pointer}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line2);border-radius:14px;background:rgba(255,255,255,.4)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.lost td{background:#FDEEEA}
.scroll{overflow-x:auto}
/* login */
#login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
#login .art{background:var(--side);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
#login .art svg.bg{position:absolute;inset:auto -60px -80px auto;width:520px;max-width:90%;opacity:.95}
#login .form{display:grid;place-items:center;padding:32px}
#login .box{width:min(400px,100%);display:grid;gap:16px}
.ulist{display:grid;gap:8px}
.ubtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;text-align:left;min-height:56px}
.ubtn.on{border-color:var(--or);background:#fff}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-weight:800;font-size:13px;flex:none}
.av.or{background:var(--or)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em}
.logo .mk{width:40px;height:40px;border-radius:9px;background:var(--or);display:grid;place-items:center;color:#fff;font-weight:900;font-size:17px;letter-spacing:-.04em;font-family:Archivo,sans-serif}
.logo .wm{display:grid;line-height:1}.logo .wm b{font-weight:900;font-size:15px;letter-spacing:.02em}.logo .wm small{font-family:Manrope,sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--or);margin-top:3px}
/* app */
#app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;min-height:100dvh}
#side{background:var(--side);color:#E9E1D4;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
#side .logo{padding:4px 8px 18px;color:#fff}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#D9CFC0;text-decoration:none;font-weight:600;font-size:14px;min-height:44px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--side2);color:#fff}
.nav.on{background:var(--side2);color:#fff;box-shadow:inset 3px 0 0 var(--or)}
.nav .badge{margin-left:auto;background:#E23B2E;color:#fff;border-radius:99px;font-size:11px;font-weight:800;padding:1px 7px}
.div{height:1px;background:#3A332B;margin:10px 8px}
#main{display:flex;flex-direction:column;min-height:100vh}
#top{display:flex;align-items:center;gap:12px;padding:12px max(3vw,16px);border-bottom:1px solid var(--line);background:rgba(255,253,249,.88);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20}
#view{padding:24px max(3vw,16px) 60px;max-width:1240px;width:100%;margin:0 auto;display:grid;gap:18px;align-content:start}
#menuBtn{display:none}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
/* dashboard */
.kpi{display:grid;gap:6px}
.kpi .v{font-size:clamp(19px,1.9vw,26px);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
.hero{display:flex;align-items:center;gap:18px;padding:26px 28px;border-radius:18px;background:var(--ink);color:#fff;border:0;cursor:pointer;text-align:left;width:100%;position:relative;overflow:hidden;min-height:120px}
.hero:hover .go{transform:translateX(4px)}
.hero .go{transition:transform .2s;margin-left:auto;width:52px;height:52px;border-radius:50%;background:var(--or);display:grid;place-items:center;flex:none}
.hero h2{font-size:clamp(22px,3vw,30px)}
.short{text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:12px;padding:16px;border-radius:14px;background:var(--paper);border:1px solid var(--line);cursor:pointer;font-weight:700;min-height:64px;text-align:left;width:100%}
.short:hover{border-color:var(--or)}
.short .ci{width:40px;height:40px;border-radius:10px;background:var(--orl);color:var(--or2);display:grid;place-items:center;flex:none}
.up{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.up:last-child{border-bottom:0}
.dt{display:grid;place-items:center;background:var(--orl);color:var(--or2);border-radius:10px;padding:6px 0;line-height:1.05}
.dt b{font-size:20px}.dt span{font-size:11px;font-weight:700;text-transform:uppercase}
/* events list */
.ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;cursor:pointer}
.ev:hover{border-color:var(--line2)}
.handle{cursor:grab;color:var(--muted);touch-action:none;user-select:none;font-size:18px;width:28px;text-align:center}
.dragging{opacity:.6;box-shadow:0 10px 30px rgba(0,0,0,.18)!important}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:0 14px;min-height:40px;cursor:pointer;font-weight:700;font-size:13px}
.seg button.on{background:var(--ink);color:#fff}
/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line2);padding-bottom:0;scrollbar-width:thin}
.tabs button{flex:none;border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;min-height:44px;font-size:14px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--or)}
.ehead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
/* lists */
.li{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);background:#fff;border-radius:10px}
.li+.li{margin-top:6px}
.li [contenteditable]{flex:1;padding:4px 6px;border-radius:6px;min-height:28px}
.li.done [contenteditable]{text-decoration:line-through;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:#EADFCD;overflow:hidden}.bar>i{display:block;height:100%;background:var(--or);border-radius:99px;transition:width .3s}
/* timeline */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.tl .it{position:relative;padding:0 0 16px}
.tl .it:before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--or);box-shadow:0 0 0 3px var(--paper)}
.tl .hd{font-weight:800;font-size:13px;color:var(--or2)}
.tbig{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;width:76px;flex:none}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow-y:auto;padding:6px}
.msg{max-width:min(78%,520px);padding:10px 14px;border-radius:14px;background:#ECE4D7}
.msg.me{align-self:flex-end;background:var(--or);color:#fff;border-bottom-right-radius:4px}
.msg:not(.me){border-bottom-left-radius:4px}
.msg .meta{font-size:11px;opacity:.8;font-weight:700;margin-bottom:2px}
/* photos */
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ph figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eee}
.ph figcaption{padding:8px}
.ph input{min-height:36px;font-size:14px;padding:6px 8px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper)}
.cal .dh{padding:8px;font-size:12px;font-weight:800;color:var(--muted);text-align:center;background:#F7F1E7;border-bottom:1px solid var(--line)}
.cal .d{min-height:96px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.cal .d:nth-child(7n){border-right:0}
.cal .d.out{background:#F8F4EC;color:#B5AA9A}
.cal .d .n{font-size:13px;font-weight:700;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.cal .d.today .n{background:var(--or);color:#fff}
.cal .d.today{background:#FFF4EA}
.chip{font-size:12px;background:var(--or);color:#fff;padding:3px 6px;border-radius:6px;cursor:pointer;border:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
/* org */
.orgwrap{position:relative;height:70vh;min-height:420px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;background-image:radial-gradient(#E3D8C6 1px,transparent 1px);background-size:22px 22px;touch-action:none;user-select:none}
.orgworld{position:absolute;left:0;top:0;transform-origin:0 0;width:4000px;height:3000px}
.orgworld svg{position:absolute;inset:0;width:4000px;height:3000px;overflow:visible}
.node{position:absolute;width:190px;border-radius:10px;background:#fff;border:2px solid var(--nc,#1C1713);box-shadow:var(--sh);cursor:move;overflow:hidden}
.node.sel{outline:3px solid #3B82F6;outline-offset:2px}
.node .t{padding:10px 10px 8px;font-weight:800;font-size:14px;text-align:center;min-height:38px;overflow-wrap:anywhere}
.node .s{padding:6px 10px;background:var(--nc,#1C1713);color:#fff;font-size:12px;text-align:center;min-height:28px;overflow-wrap:anywhere}
.node.light .s{color:#1C1713}
.marq{position:absolute;border:1.5px dashed #3B82F6;background:rgba(59,130,246,.08);pointer-events:none}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line2);cursor:pointer;padding:0}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(20,18,16,.45);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:100;overflow-y:auto}
#modal.on{display:flex}
#modal .mbox{background:var(--paper);border-radius:16px;width:min(720px,100%);padding:22px;display:grid;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#modal .mbox.wide{width:min(1100px,100%)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:200;display:none;max-width:90vw}
.ac{position:relative}
.acl{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:var(--sh);z-index:30;max-height:240px;overflow-y:auto}
.acl button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:none;cursor:pointer;min-height:40px}
.acl button:hover{background:var(--orl)}
.stars{white-space:nowrap}.stars button{border:0;background:none;cursor:pointer;font-size:20px;color:#D8CBB6;padding:0 1px}
.stars button.on{color:var(--or)}
.stars.ro button{cursor:default}
.panel h2{margin-top:8px}
.prose{display:grid;gap:12px;max-width:72ch}
.prose h2{font-size:20px;margin-top:10px}
.prose ul{margin:0;padding-left:20px;display:grid;gap:4px}
.prose blockquote{margin:0;padding:14px 18px;border-left:4px solid var(--or);background:#fff;border-radius:0 10px 10px 0;font-family:Archivo,sans-serif;font-weight:800;font-size:clamp(17px,2vw,21px);line-height:1.3}
.mdt td,.mdt th{vertical-align:top}.mdt th{font-size:13px;color:var(--ink)}
.sw{border:1px solid var(--line);border-radius:12px;min-height:110px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;font:inherit}.sw span{font-family:ui-monospace,monospace;font-size:13px}
.lead{display:grid;gap:8px;padding:14px}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.col>h3{font-size:13px;display:flex;justify-content:space-between;padding:4px 4px 6px}
.dre{display:grid;border-top:1px solid var(--line2)}
.dl{display:grid;grid-template-columns:28px minmax(0,1fr) auto 64px;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.dl .dn{width:26px;height:26px;border-radius:50%;background:#EFE6D8;display:grid;place-items:center;font-size:12px;font-weight:800}
.dl.sub{background:#FBF6EF}.dl.sub .dn,.dl.top .dn{background:var(--ink);color:#fff}
.dl.end{background:var(--orl)}.dl.end .dn{background:var(--or);color:#fff}
.dl .dv{font-family:Archivo,sans-serif;font-weight:800;font-size:17px}.dl.end .dv{font-size:21px}
.dret td,.dret th{padding:8px 6px;font-size:13px}.dret tr.sub td{background:#FBF6EF}
@media(max-width:600px){.dl{grid-template-columns:24px minmax(0,1fr) auto}.dl .dp{display:none}}
.print-only{display:none}
@media print{body{background:#fff}body.printing #root{display:none!important}#side,#top,.noprint,.tabs{display:none!important}#app{display:block}#view{padding:0}.card{box-shadow:none;border:0}.print-only{display:block}}
@media(max-width:900px){
 #app{grid-template-columns:1fr}
 #side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s}
 #side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
 #menuBtn{display:inline-grid}
 #login{grid-template-columns:1fr}
 #login .art{min-height:220px;padding:28px}
}
@media(max-width:600px){
 table{font-size:13px}
 .stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}
 .stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}
 .stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--muted);font-size:12px;font-weight:700}
 .stack td:empty{display:none}
 .cal .d{min-height:64px;padding:3px}.chip{font-size:10px;padding:2px 3px}
 .up{grid-template-columns:54px minmax(0,1fr)}.up>:last-child{grid-column:2}
 .ev{grid-template-columns:auto minmax(0,1fr)}.ev>:last-child{grid-column:1/-1}
 .hero{padding:20px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;const r=c.closest('table').rows[0];c.dataset.l=r&&r.cells[i]?r.cells[i].textContent:''}}).observe(document,{childList:true,subtree:true})</script>

function sha256(ascii){ascii=unescape(encodeURIComponent(ascii));const rr=(v,a)=>(v>>>a)|(v<<(32-a));const mp=Math.pow,maxWord=mp(2,32);let result='',words=[],asciiBitLength=ascii.length*8,hash=[],k=[],pc=0,i,j;const isC={};for(let c=2;pc<64;c++){if(!isC[c]){for(i=0;i<313;i+=c)isC[i]=c;hash[pc]=(mp(c,.5)*maxWord)|0;k[pc++]=(mp(c,1/3)*maxWord)|0}}ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}words[words.length]=((asciiBitLength/maxWord)|0);words[words.length]=asciiBitLength;hash=hash.slice(0,8);for(j=0;j<words.length;){const w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);for(i=0;i<64;i++){const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}for(i=0;i<8;i++)for(j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16)}return result}

/* ================= armazenamento local (IndexedDB, com memória como reserva) ================= */
const Local={db:null,mem:{},ok:false,
 open(){return new Promise(res=>{try{const r=indexedDB.open('gr-events-sistem',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('files'))d.createObjectStore('files')};r.onsuccess=()=>{this.db=r.result;this.ok=true;res()};r.onerror=()=>res()}catch(e){res()}})},
 tx(store,mode,fn){return new Promise((res,rej)=>{if(!this.db){res(fn(null));return}try{const t=this.db.transaction(store,mode),o=t.objectStore(store);const r=fn(o);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)}catch(e){rej(e)}})},
 async get(k){if(!this.db)return this.mem[k];return new Promise(res=>{try{const r=this.db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined)}catch(e){res(undefined)}})},
 async set(k,v){this.mem[k]=v;if(!this.db)return;try{await this.tx('kv','readwrite',o=>o.put(JSON.parse(JSON.stringify(v)),k))}catch(e){toast('Não foi possível salvar neste aparelho.')}},
 async putFile(blob){const id='f_'+uid();this.mem[id]=blob;if(this.db){try{await this.tx('files','readwrite',o=>o.put(blob,id))}catch(e){toast('Arquivo grande demais para guardar neste aparelho.')}}return id},
 async getFile(id){if(this.mem[id])return this.mem[id];if(!this.db)return null;return new Promise(res=>{try{const r=this.db.transaction('files').objectStore('files').get(id);r.onsuccess=()=>{if(r.result)this.mem[id]=r.result;res(r.result||null)};r.onerror=()=>res(null)}catch(e){res(null)}})},
 async delFile(id){delete this.mem[id];if(this.db){try{await this.tx('files','readwrite',o=>o.delete(id))}catch(e){}}},
 allFiles(){return new Promise(res=>{const out=[];if(!this.db){res(out);return}try{const r=this.db.transaction('files').objectStore('files').openCursor();r.onsuccess=()=>{const c=r.result;if(c){out.push([c.key,c.value]);c.continue()}else res(out)};r.onerror=()=>res(out)}catch(e){res(out)}})}
};

/* autocomplete genérico */
function autocomplete(input,getList,onPick,opt={}){let box;const close=()=>{box&&box.remove();box=null};
 input.setAttribute('autocomplete','off');
 const show=()=>{close();const q=norm(input.value);if(!q&&!opt.all)return;let l=getList();if(q)l=l.filter(x=>norm(x.label+' '+(x.sub||'')).includes(q));else l=l.slice().sort((x,y)=>x.label.localeCompare(y.label,'pt-BR'));l=l.slice(0,q?8:60);if(!l.length)return;box=document.createElement('div');box.className='acl';box.innerHTML=l.map((x,i)=>`<button type="button" data-i="${i}" style="display:flex;align-items:center;gap:10px">${x.pre||''}<span>${esc(x.label)}${x.sub?` <span class="muted small">· ${esc(x.sub)}</span>`:''}</span></button>`).join('');input.parentElement.classList.add('ac');input.parentElement.appendChild(box);box.addEventListener('mousedown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();const it=l[+b.dataset.i];input.value=it.label;close();onPick&&onPick(it)})};
 input.addEventListener('input',show);if(opt.all)input.addEventListener('focus',show);
 input.addEventListener('blur',()=>setTimeout(close,150))}

function fallbackDownload(name,data){try{const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return true}catch(e){return false}}

 if(DL){try{await DL.save({filename:name,data});toast('Arquivo salvo: '+name);return}catch(e){if(e&&e.code==='declined')return;}}
 fallbackDownload(name,data);toast('Download iniciado: '+name)}

 const fname=title.replace(/[^\w\-À-ú ]+/g,'').trim().replace(/\s+/g,'_')+'.html';
 const b=modal(`${mhead('Imprimir · '+title)}<p class="muted small">Se a janela de impressão não abrir neste navegador, baixe a versão para impressão: ela abre a impressão sozinha.</p><div class="row"><button class="btn pri" data-p>${ic('print')} Imprimir agora</button><button class="btn" data-d>${ic('dl')} Baixar para imprimir</button></div><div class="card" style="max-height:50vh;overflow:auto">${body}</div>`,{wide:true});
 b.querySelector('[data-p]').onclick=()=>{const pa=$('#printArea');pa.innerHTML=body;document.body.classList.add('printing');closeModal();setTimeout(()=>{try{window.print()}catch(e){}setTimeout(()=>{pa.innerHTML='';document.body.classList.remove('printing')},1000)},50)};
 b.querySelector('[data-d]').onclick=()=>download(fname,doc);
}

function sbInit(){

const Cloud={
 on:false,
 async get(k){
  const r=await sb.from('kv').select('value').eq('key',k).maybeSingle();
  if(r.error)throw r.error;
  return r.data?r.data.value:undefined;
 },
 async set(k,v){
  const r=await sb.from('kv').upsert({key:k,value:v===undefined?null:JSON.parse(JSON.stringify(v)),updated_at:new Date().toISOString()});
  if(r.error)toast('Não foi possível salvar na nuvem: '+(r.error.message||''));
 },
 async putFile(blob,name){
  const ext=(name||blob.name||'').split('.').pop();
  const id='f_'+uid()+(ext&&ext.length<6?'.'+ext.toLowerCase():'');
  const r=await sb.storage.from('files').upload(id,blob,{contentType:blob.type||'application/octet-stream',upsert:true});
  if(r.error){toast('Não foi possível enviar o arquivo: '+(r.error.message||''));return ''}
  return id;
 },
 async getFile(id){
  if(!id)return null;
  const r=await sb.storage.from('files').download(id);
  return r.data||null;
 },
 async delFile(id){if(id)await sb.storage.from('files').remove([id])}
};

function pickCol(row,key){const keys=Object.keys(row);for(const a of ALIAS[key]){const k=keys.find(x=>norm(x)===norm(a));if(k!==undefined&&row[k]!==''&&row[k]!=null)return row[k]}return ''}
const UF={'rio de janeiro':'RJ','sao paulo':'SP','parana':'PR','minas gerais':'MG','espirito santo':'ES','santa catarina':'SC','rio grande do sul':'RS','bahia':'BA','distrito federal':'DF','goias':'GO','pernambuco':'PE','ceara':'CE'};
const ufOf=v=>{const n=norm(v);return UF[n]||String(v||'').trim().toUpperCase().slice(0,20)};
function xlDate(v){if(!v)return '';if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*36e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:''}
function parseCSV(txt){const sep=(txt.split('\n')[0].match(/;/g)||[]).length>(txt.split('\n')[0].match(/,/g)||[]).length?';':',';
 const lines=[];let cur=[''],q=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){cur[cur.length-1]+='"';i++}else q=false}else cur[cur.length-1]+=c}else if(c==='"')q=true;else if(c===sep)cur.push('');else if(c==='\n'){lines.push(cur);cur=['']}else if(c!=='\r')cur[cur.length-1]+=c}if(cur.join(''))lines.push(cur);
 const hd=lines.shift()||[];return lines.filter(l=>l.join('').trim()).map(l=>Object.fromEntries(hd.map((h,i)=>[h.trim(),l[i]??''])))}
async function readSheets(file){
 const name=file.name.toLowerCase();
 if(name.endsWith('.csv'))return [{sheet:file.name.replace(/\.csv$/i,''),rows:parseCSV(await file.text())}];
 if(!window.XLSX)throw new Error('Leitor de Excel indisponível agora. Recarregue a página ou salve cada aba como CSV.');
 const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
 return wb.SheetNames.map(sn=>({sheet:sn,rows:XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''})}));
}

function sheetKind(n){n=norm(n);if(/client/.test(n))return 'clientes';if(/equipe|colaborador|staff|funcionari/.test(n))return 'equipe';if(/fornecedor|parceir/.test(n))return 'fornecedores';if(/entrada|receita|recebimento/.test(n))return 'entradas';if(/saida|despesa|pagamento|custo/.test(n))return 'saidas';if(/orcamento|proposta/.test(n))return 'orcamentos';return ''}
function importRows(kind,rows,R,sheet){
 const r0={ok:0,upd:0,bad:[]};
 rows.forEach((r,i)=>{const ln=`${sheet?sheet+', ':''}linha ${i+2}`;const g=k=>{const v=pickCol(r,k);return v==null?'':String(v).trim()};
  if(kind==='entradas'||kind==='saidas'){const value=Math.abs(num(pickCol(r,'value'))),date=xlDate(pickCol(r,'date')),desc=g('desc')||g('company');

   const tp=kind==='entradas'?'entrada':'saida';let st=g('status');const ok=tp==='entrada'?['RECEBIDO','ENTRADA PROVÁVEL','PENDENTE']:['pago','a pagar','PENDENTE'];st=ok.find(x=>norm(x)===norm(st))||(tp==='entrada'?'PENDENTE':'a pagar');
   const dn=norm(g('dre'));const dre=!dn?'auto':dn.startsWith('receita')?'receita':dn.startsWith('dedu')?'deducao':dn.startsWith('csp')||dn.includes('custo do servico')?'csp':dn.startsWith('despesa')?'despesa':dn.startsWith('resultado')||dn.includes('financeiro')?'financeiro':dn.startsWith('fora')?'fora':'auto';
   const D=desc||'(sem descrição)';const key=[date,tp,value.toFixed(2),norm(D)].join('|');if(!importRows.ex){importRows.ex={};S.cash.forEach(x=>{const k=[x.date,x.type,num(x.value).toFixed(2),norm(x.desc)].join('|');importRows.ex[k]=(importRows.ex[k]||0)+1});importRows.seen={}}importRows.seen[key]=(importRows.seen[key]||0)+1;if((importRows.ex[key]||0)>=importRows.seen[key]){r0.same=(r0.same||0)+1;return}
   S.cash.push({id:uid(),desc:D,company:g('company'),value,type:tp,status:st,account:g('account'),date,cc:g('cc'),costType:g('costType'),obs:g('obs'),dre,recurring:false,order:Date.now()+i,importId:CUR_IMPORT});r0.ok++;return}
  if(kind==='orcamentos'){const name=g('desc')||g('name');if(!name){if(Object.values(r).some(v=>String(v).trim()))r0.bad.push(`${ln}: sem evento/serviço`);return}
   let st=norm(pickCol(r,'status'));st=st.startsWith('fech')?'FECHADO':st.startsWith('perd')||st.startsWith('recus')?'PERDIDO':'PENDENTE';
   const rz=norm(g('realization')),real=rz.startsWith('realiz')?'REALIZADO':rz.startsWith('cancel')?'CANCELADO':st==='PERDIDO'?'CANCELADO':'A REALIZAR';
   const bd={date:xlDate(pickCol(r,'date'))||today(),name,client:g('client'),quoted:num(pickCol(r,'quoted')),closed:num(pickCol(r,'closed')),profit:num(pickCol(r,'profit')),status:st,realization:real,obs:g('obs')};const ry=parseInt(g('refYear'));if(ry>1990&&ry<2100)bd.year=ry;
   const dup=S.budgets.find(x=>x.date===bd.date&&norm(x.name)===norm(bd.name)&&Math.abs(num(x.quoted)-bd.quoted)<.01);
   if(dup){r0.same=(r0.same||0)+1;return}
   S.budgets.push({id:uid(),...bd,eventId:'',importId:CUR_IMPORT});r0.ok++;return}
  const name=g('name');if(!name){if(Object.values(r).some(v=>String(v).trim()))r0.bad.push(`${ln}: sem nome`);return}
  const ev=g('evalText'),rt=num(pickCol(r,'rating'))||({'otima':5,'excelente':5,'boa':4,'regular':3,'ruim':2}[norm(ev)]||0);
  const notes=[g('obs'),kind==='fornecedores'&&ev?'Avaliação: '+ev:''].filter(Boolean).join(' · ');
  const base={name,phone:g('phone'),email:g('email'),doc:g('doc'),city:g('city'),state:ufOf(g('state')),notes};
  let rec;
  if(kind==='clientes')rec={...base,company:g('company2'),contact:g('contact'),hist:(pickCol(r,'hSent')!==''||pickCol(r,'hTotal')!=='')?{sent:num(pickCol(r,'hSent')),closed:num(pickCol(r,'hClosed')),total:num(pickCol(r,'hTotal'))}:undefined};
  if(kind==='fornecedores')rec={...base,category:g('category'),contact:g('contact'),pix:g('pix'),bank:g('bank'),price:g('price'),operation:g('operation'),rating:Math.max(0,Math.min(5,Math.round(rt)))};
  if(kind==='equipe')rec={...base,role:g('role'),pix:g('pix'),bank:g('bank'),rg:g('rg'),rating:Math.max(0,Math.min(5,Math.round(rt)))};
  const key={clientes:'clients',fornecedores:'suppliers',equipe:'team'}[kind];
  const ex=S[key].find(x=>norm(x.name)===norm(name));
  if(ex){let ch=false;for(const [k,v] of Object.entries(rec)){if(v===undefined||v===''||v===0)continue;if(k==='hist'?JSON.stringify(ex.hist)!==JSON.stringify(v):(ex[k]===undefined||ex[k]===''||ex[k]===0)){ex[k]=v;ch=true}}if(ch)r0.upd++;else r0.same=(r0.same||0)+1}
  else{S[key].push({id:uid(),...rec,importId:CUR_IMPORT});r0.ok++}
 });
 const t=R[kind]=R[kind]||{ok:0,upd:0,same:0,bad:[]};t.ok+=r0.ok;t.upd+=r0.upd;t.same+=r0.same||0;t.bad.push(...r0.bad);
}

/* lê o backup (.zip) gerado na versão antiga e põe tudo na nuvem */
async function importBackup(file){
 const m=modal(`${mhead('Carregar backup')}<div class="grid"><p id="bks">Abrindo o arquivo…</p><div class="row"><span class="sp"></span><button class="btn" type="button" data-close>Fechar</button><button class="btn pri" id="bko" disabled>Carregar</button></div></div>`);
 const st=t=>{const e=$('#bks');if(e)e.innerHTML=t};
 try{
  if(!window.JSZip)throw new Error('o leitor de ZIP não carregou; recarregue a página');
  const z=await JSZip.loadAsync(file);
  let base='',dj=z.file('data.json');
  if(!dj)z.forEach((rel,f)=>{if(!dj&&!f.dir&&/(^|\/)data\.json$/.test(rel)){dj=f;base=rel.slice(0,rel.length-9)}});
  if(!dj)throw new Error('este ZIP não é um backup do sistema (falta o data.json)');
  const data=JSON.parse(await dj.async('string'));
  let types={};const tj=z.file(base+'types.json');if(tj){try{types=JSON.parse(await tj.async('string'))}catch(_){}}
  const pre=base+'files/',files=[];z.forEach((rel,f)=>{if(!f.dir&&rel.indexOf(pre)===0)files.push([rel.slice(pre.length),f])});
  const ks=Object.keys(data).filter(k=>KEYS.includes(k));
  const n=ks.reduce((a,k)=>a+(Array.isArray(data[k])?data[k].length:0),0);
  if(!ks.length)throw new Error('o backup está vazio');
  st(`Encontrei <b>${n}</b> registro(s) e <b>${files.length}</b> arquivo(s).<br>
   <span class="muted small">${ks.map(k=>`${k}: ${Array.isArray(data[k])?data[k].length:'ok'}`).join(' · ')}</span>
   <br><br><b>Atenção:</b> carregar substitui o que está na nuvem hoje por este backup.`);
  $('#bko').disabled=false;
  $('#bko').onclick=async()=>{
   $('#bko').disabled=true;
   try{
    let i=0;
    for(const [name,f] of files){
     const blob=await f.async('blob');
     const r=await sb.storage.from('files').upload(name,blob,{contentType:types[name]||blob.type||'application/octet-stream',upsert:true});
     if(r.error)throw new Error('arquivo '+name+': '+(r.error.message||''));
     i++;if(i%3===0||i===files.length)st(`Enviando arquivos… ${i}/${files.length}`);
    }
    st('Enviando os cadastros e os lançamentos…');
    const rows=ks.map(k=>({key:k,value:data[k],updated_at:new Date().toISOString()}));
    const r=await sb.from('kv').upsert(rows);
    if(r.error)throw new Error(r.error.message||'');
    ks.forEach(k=>S[k]=data[k]);
    Object.keys(urlCache).forEach(k=>delete urlCache[k]);
    await preloadPhotos();
    st('<b>Pronto.</b> Os dados estão na nuvem e já aparecem para todo mundo que tem acesso.');
    toast('Backup carregado.');
   }catch(e){st('<span style="color:var(--bad)">Falhou: '+esc(e.message||String(e))+'</span>');$('#bko').disabled=false}
  };
 }catch(e){st('<span style="color:var(--bad)">'+esc(e.message||String(e))+'</span>')}
}

/* manda para a nuvem um conjunto de dados + arquivos já lidos */
async function pushToCloud(data,files,types,st){
 let i=0;
 for(const [name,getBlob] of files){
  const blob=await getBlob();
  const r=await sb.storage.from('files').upload(name,blob,{contentType:types[name]||blob.type||'application/octet-stream',upsert:true});
  if(r.error)throw new Error('arquivo '+name+': '+(r.error.message||''));
  i++;if(i%3===0||i===files.length)st(`Enviando arquivos… ${i}/${files.length}`);
 }
 st('Enviando os cadastros e os lançamentos…');
 const ks=Object.keys(data).filter(k=>KEYS.includes(k));
 const r=await sb.from('kv').upsert(ks.map(k=>({key:k,value:data[k],updated_at:new Date().toISOString()})));
 if(r.error)throw new Error(r.error.message||'');
 ks.forEach(k=>S[k]=data[k]);
 Object.keys(urlCache).forEach(k=>delete urlCache[k]);
 await preloadPhotos();
 st('<b>Pronto.</b> Os dados estão na nuvem e já aparecem para todo mundo que tem acesso.');
 toast('Dados carregados.');
}

/* ================= arrastar para reordenar (mouse e toque) ================= */
function sortable(list,item,handle,done){
 list.addEventListener('pointerdown',e=>{const h=e.target.closest(handle);if(!h||!list.contains(h))return;const el=h.closest(item);if(!el)return;e.preventDefault();e.stopPropagation();el.classList.add('dragging');try{h.setPointerCapture(e.pointerId)}catch(_){}
  const move=ev=>{const sibs=[...list.querySelectorAll(item)].filter(x=>x!==el);for(const s of sibs){const r=s.getBoundingClientRect();if(ev.clientY<r.top+r.height/2){if(el.nextElementSibling!==s)s.before(el);return}}const last=sibs[sibs.length-1];if(last&&last.nextElementSibling!==el)last.after(el)};
  const up=()=>{el.classList.remove('dragging');h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);done([...list.querySelectorAll(item)].map(x=>x.dataset.id))};
  h.addEventListener('pointermove',move);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)});
 list.addEventListener('click',e=>{if(e.target.closest(handle))e.stopPropagation()},true);
}

 root.folder('07 Organograma').file('organograma.txt',ev.org.nodes.map(n=>`${n.title}${n.sub?' — '+n.sub:''}`).join('\r\n')+'\r\n\r\nLigações:\r\n'+ev.org.edges.map(e=>{const a=ev.org.nodes.find(n=>n.id===e.from),b=ev.org.nodes.find(n=>n.id===e.to);return a&&b?`${a.title} → ${b.title}`:''}).filter(Boolean).join('\r\n'));

/* organograma desenhado como imagem fixa (cabe na tela e na impressão) */
function orgStaticHTML(ev){
 const N=(ev.org&&ev.org.nodes)||[];if(!N.length)return '';
 const W=190,lines=(t,n)=>Math.max(1,Math.ceil(String(t||'').length/n));
 const hOf=n=>Math.max(38,16+18*lines(n.title,17))+Math.max(28,12+15*lines(n.sub,24));
 const x0=Math.min(...N.map(n=>n.x))-12,y0=Math.min(...N.map(n=>n.y))-12;
 const B={};N.forEach(n=>B[n.id]={x:n.x-x0,y:n.y-y0,w:W,h:hOf(n)});
 const Wt=Math.max(...Object.values(B).map(b=>b.x+b.w))+12,Ht=Math.max(...Object.values(B).map(b=>b.y+b.h))+12;
 const clip=(b,tx,ty)=>{const cx=b.x+b.w/2,cy=b.y+b.h/2,dx=tx-cx,dy=ty-cy;if(!dx&&!dy)return {x:cx,y:cy};const k=Math.min(Math.abs((b.w/2+4)/(dx||1e-9)),Math.abs((b.h/2+4)/(dy||1e-9)));return {x:cx+dx*k,y:cy+dy*k}};
 const edges=(ev.org.edges||[]).map(e=>{const a=B[e.from],b=B[e.to];if(!a||!b)return '';const p=clip(a,b.x+b.w/2,b.y+b.h/2),q=clip(b,a.x+a.w/2,a.y+a.h/2);return `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="#1C1713" stroke-width="2" marker-end="url(#rah)"/>`}).join('');
 const pc='-webkit-print-color-adjust:exact;print-color-adjust:exact;';
 const nodes=N.map(n=>{const b=B[n.id],c=n.color||'#1C1713',lt=['#E8B21F'].includes(c);return `<div style="position:absolute;left:${b.x}px;top:${b.y}px;width:${W}px;border:2px solid ${c};border-radius:10px;background:#fff;overflow:hidden;box-sizing:border-box;${pc}"><div style="padding:9px 10px 7px;font-weight:800;font-size:14px;line-height:1.25;text-align:center;overflow-wrap:anywhere">${esc(n.title)}</div><div style="padding:6px 10px;background:${c};color:${lt?'#1C1713':'#fff'};font-size:12px;line-height:1.3;text-align:center;min-height:16px;overflow-wrap:anywhere;${pc}">${esc(n.sub||'')}</div></div>`}).join('');
 const z=Math.min(1,700/Wt);
 return `<h2>Organograma</h2><div style="overflow-x:auto"><div style="position:relative;width:${Wt}px;height:${Ht}px;zoom:${z};page-break-inside:avoid"><svg width="${Wt}" height="${Ht}" style="position:absolute;inset:0;overflow:visible"><defs><marker id="rah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1C1713"/></marker></defs>${edges}</svg>${nodes}</div></div>`;
}

function extenso(v){
 const U=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'],D=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'],C=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
 const tri=n=>{if(n===100)return 'cem';const c=Math.floor(n/100),r=n%100,p=[];if(c)p.push(C[c]);if(r)p.push(r<20?U[r]:D[Math.floor(r/10)]+(r%10?' e '+U[r%10]:''));return p.join(' e ')};
 const inteiro=n=>{if(!n)return 'zero';const g=[[Math.floor(n/1e9),'bilhão','bilhões'],[Math.floor(n/1e6)%1000,'milhão','milhões'],[Math.floor(n/1e3)%1000,'mil','mil'],[n%1000,'','']].filter(x=>x[0]);
  return g.map((x,i)=>{let t=x[1]==='mil'?(x[0]===1?'mil':tri(x[0])+' mil'):x[1]?(x[0]===1?'um '+x[1]:tri(x[0])+' '+x[2]):tri(x[0]);if(i>0&&i===g.length-1&&(x[0]<100||x[0]%100===0))t='e '+t;return t}).join(' ').replace(/ (?=e )/g,' ')};
 v=Math.round(num(v)*100);const r=Math.floor(v/100),c=v%100;let s='';
 if(r)s=inteiro(r)+(r===1?' real':(r%1e6===0?' de reais':' reais'));
 if(c)s+=(s?' e ':'')+tri(c)+(c===1?' centavo':' centavos');
 return s||'zero reais';
}

/* link secreto para assinar a agenda no Google Agenda (só eventos ativos, sem valores) */
async function calFeedToken(renew){
 const uidMe=ME.id;
 if(renew){const d=await sb.from('calendar_feeds').delete().eq('user_id',uidMe);if(d.error)throw d.error}
 let r=await sb.from('calendar_feeds').select('token').eq('user_id',uidMe).maybeSingle();
 if(r.error)throw r.error;
 if(r.data)return r.data.token;
 r=await sb.from('calendar_feeds').insert({user_id:uidMe}).select('token').single();
 if(r.error)throw r.error;

}

const DRE_CATS=[['auto','Automático'],['receita','Receita bruta'],['deducao','Deduções e impostos sobre venda'],['csp','CSP · custo do serviço (eventos)'],['despesa','Despesas operacionais (fixas)'],['financeiro','Resultado financeiro e IR/CSLL'],['fora','Fora da DRE (empréstimo, aporte, retirada de sócios)']];
const dreName=k=>(DRE_CATS.find(x=>x[0]===k)||[,k])[1];
function dreCat(c){
 if(c.dre&&c.dre!=='auto')return c.dre;
 if(c.type==='entrada')return 'receita';
 const t=norm([c.costType,c.desc].join(' '));
 if(/\b(das|iss|pis|cofins|simples nacional|imposto sobre venda|nota fiscal)\b/.test(t))return 'deducao';
 if(/\b(irpj|csll|juros|tarifa|taxa de maquin|maquininha|antecipacao|iof|boleto)\b/.test(t))return 'financeiro';
 if(c.eventId)return 'csp';
 return 'despesa';
}
const dreCfg=()=>Object.assign({mode:'auto',rate:10,basis:'previsto',mults:[3,4,5],caixa:0,dividas:0},S.settings.dre||{});
function dreCalc(list){
 const cfg=dreCfg();
 const ok=c=>cfg.basis==='previsto'||(c.type==='entrada'?c.status==='RECEBIDO':c.status==='pago');
 const L=list.filter(ok),sumC=(k,t)=>L.filter(c=>dreCat(c)===k&&(!t||c.type===t)).reduce((s,c)=>s+(c.type==='entrada'?1:-1)*num(c.value),0);
 const rb=sumC('receita');
 const dedL=-sumC('deducao');
 const useL=cfg.mode==='lancamentos'||(cfg.mode==='auto'&&dedL>0);const ded=useL?dedL:rb*num(cfg.rate)/100;
 const rl=rb-ded,csp=-sumC('csp'),lb=rl-csp,desp=-sumC('despesa'),ebit=lb-desp,fin=-sumC('financeiro'),ll=ebit-fin;
 return {rb,ded,dedL,rl,csp,lb,desp,ebit,fin,ll,mb:rl?lb/rl:NaN,mo:rb?ebit/rb:NaN,ml:rb?ll/rb:NaN,ign:!useL?L.filter(c=>dreCat(c)==='deducao').length:0,useL,fora:L.filter(c=>dreCat(c)==='fora').length};
}

function realMargins(){const ys=[...new Set(S.cash.map(c=>+String(c.date).slice(0,4)).filter(Boolean))];return ys.map(y=>{const cash=S.cash.filter(x=>cxIn(x,y,null)),d=dreCalc(cash);return {y,ok:d.rb>0&&cash.some(x=>x.type==='saida'&&dreCat(x)!=='fora'),mg:d.rb?d.ebit/d.rb:0}}).filter(r=>r.ok)}
function yearBase(y){
 const c=dreCfg2(),cash=S.cash.filter(x=>cxIn(x,y,null)),d=dreCalc(cash);
 const hasCosts=cash.some(x=>x.type==='saida'&&!['fora'].includes(dreCat(x)));
 const bud=S.budgets.filter(b=>b.status==='FECHADO'&&bYear(b)===y).reduce((s,b)=>s+budgetClosed(b),0);
 const h=(S.history||[]).find(r=>+r.year===y)||{};const hClosed=num(h.closed),hProfit=num(h.profit);
 let rev=0,rsrc='';
 const opts={caixa:d.rb,orcamentos:bud,historico:hClosed};
 if(c.revSrc==='caixa'){rev=d.rb;rsrc='Fluxo de Caixa'}else if(c.revSrc==='orcamentos'){rev=bud;rsrc='Orçamentos fechados'}else if(c.revSrc==='historico'){rev=hClosed;rsrc='Histórico por ano'}
 else{const best=Object.entries(opts).sort((a,b)=>b[1]-a[1])[0];rev=best[1];rsrc={caixa:'Fluxo de Caixa',orcamentos:'Orçamentos fechados',historico:'Histórico por ano'}[best[0]]}
 let mg,msrc;
 if(d.rb>0&&hasCosts){mg=d.ebit/d.rb;msrc='DRE do caixa'}
 else if(hClosed>0&&hProfit>0){mg=hProfit/hClosed;msrc='Histórico (lucro ÷ fechado)'}
 else{const real=realMargins();if(real.length){mg=real.reduce((a,b)=>a+b.mg,0)/real.length;msrc='Média dos anos com DRE ('+real.map(r=>r.y).join(', ')+')'}else{mg=num(c.refMargin)/100;msrc='Margem de referência'}}
 return {y,rev,rsrc,mg,msrc,ebit:rev*mg,d,hasCash:cash.length>0,hasCosts,bud,hClosed}
}
function multiYear(endY){const c=dreCfg2(),n=Math.max(1,Math.min(6,Math.round(num(c.years)||3)));const ys=[];for(let y=endY-n+1;y<=endY;y++)ys.push(yearBase(y));

 const ebitN=wsum?used.reduce((s,x,i)=>s+x.ebit*(i+1),0)/wsum:0;

 const cagr=span>0&&first.rev>0?Math.pow(last.rev/first.rev,1/span)-1:NaN;
 return {ys,used,ebitN,cagr,n}}

const perCfg=()=>Object.assign({mode:'all',year:new Date().getFullYear(),from:'',to:''},S.settings.budPeriod||{});
function budInPeriod(b){const p=perCfg(),d=b.date||'';
 if(p.mode==='all')return true;
 if(p.mode==='year')return bYear(b)===+p.year;

/* ================= gastos recorrentes ================= */
const recKey=(desc,acc)=>{let d=norm(desc);const parc=/^\d+\s*\/\s*\d+/.test(d);d=d.replace(/\d+\s*\/\s*\d+/g,'').replace(/\s+/g,' ').trim();return (parc?'parc:':'')+d+(d.includes('cartao')?'|'+norm(acc):'')};
const ymOf=(y,m)=>y+'-'+String(m+1).padStart(2,'0');
const addMonths=(y,m,k)=>{const d=new Date(y,m+k,1);return [d.getFullYear(),d.getMonth()]};
const recAhead=()=>Math.max(1,Math.min(12,+(S.settings.recAhead||3)));
const isRecOf=(c,t)=>c.type==='saida'&&(c.recurringId===t.id||(!c.recurringId&&recKey(c.desc,c.account)===t.key));
function recActuals(t){const td=today();return S.cash.filter(c=>isRecOf(c,t)&&!c.est&&c.date&&c.date<=td).sort((a,b)=>a.date.localeCompare(b.date))}
function recEstimate(t){const a=recActuals(t).slice(-3);return a.length?Math.round(a.reduce((s,c)=>s+num(c.value),0)/a.length*100)/100:num(t.value)}
function runRecurring(){
 if(!Array.isArray(S.recurring)||!S.recurring.length)return 0;
 const now=new Date(),H=recAhead(),td=today(),monthStart=td.slice(0,8)+'01';let n=0,ch=false;
 S.recurring.filter(t=>t.active!==false).forEach(t=>{
  const val=t.kind==='variavel'?recEstimate(t):num(t.value);
  for(let k=0;k<=H;k++){const [y,m]=addMonths(now.getFullYear(),now.getMonth(),k),ym=ymOf(y,m);
   if(t.start&&ym<t.start)continue;if(t.end&&ym>t.end)continue;if((t.skip||[]).includes(ym))continue;
   if(S.cash.some(c=>isRecOf(c,t)&&(c.date||'').slice(0,7)===ym))continue;
   const last=new Date(y,m+1,0).getDate(),date=ym+'-'+String(Math.min(+t.day||5,last)).padStart(2,'0');
   S.cash.push({id:uid(),desc:t.desc,company:t.company||'',value:val,type:'saida',status:'a pagar',account:t.account||'',date,cc:t.cc||'Administrativo',costType:t.costType||(t.kind==='variavel'?'Variável':'Fixa'),obs:t.kind==='variavel'?'Valor estimado pela média dos últimos 3 meses: troque pelo valor real quando chegar a fatura':'',dre:t.dre||'auto',recurring:true,recurringId:t.id,est:t.kind==='variavel',order:Date.now()});n++;ch=true}
  if(t.kind==='variavel')S.cash.forEach(c=>{if(c.recurringId===t.id&&c.est&&c.date>=monthStart&&Math.abs(num(c.value)-val)>.009){c.value=val;ch=true}});
 });
 if(ch)save('cash');return n;
}
function recSuggestions(){
 const now=new Date(),months=[1,2,3,4].map(k=>{const [y,m]=addMonths(now.getFullYear(),now.getMonth(),-k);return ymOf(y,m)});
 const have=new Set((S.recurring||[]).map(t=>t.key));const G={};
 S.cash.forEach(c=>{if(c.type!=='saida'||c.recurringId||c.est||dreCat(c)==='fora'||!c.date)return;const k=recKey(c.desc,c.account);if(!k||have.has(k))return;(G[k]=G[k]||[]).push(c)});
 const out=[];
 Object.entries(G).forEach(([k,L])=>{const cnt={};L.forEach(c=>{const ym=c.date.slice(0,7);if(months.includes(ym))cnt[ym]=(cnt[ym]||0)+1});
  const inM=Object.keys(cnt).length,per=inM?Object.values(cnt).reduce((a,b)=>a+b,0)/inM:9;
  if(inM<3||per>1.5)return;
  L.sort((a,b)=>a.date.localeCompare(b.date));const l3=L.slice(-3).map(c=>num(c.value)),mx=Math.max(...l3),mn=Math.min(...l3),last=L[L.length-1];
  const fx=norm(last.costType)==='fixa'&&!/cartao|imposto do mes/.test(k.replace(/^parc:/,'x'));const kind=fx||mx-mn<=.03*mx?'fixo':'variavel';
  out.push({key:k,desc:last.desc.replace(/^\d+\s*\/\s*\d+\s*/,'Parcelamento · '),company:last.company,account:last.account,cc:last.cc,costType:last.costType,dre:last.dre||'auto',day:+last.date.slice(8,10),kind,value:num(last.value),avg:Math.round(l3.reduce((a,b)=>a+b,0)/l3.length*100)/100,months:inM});
 });
 return out.sort((a,b)=>(a.kind===b.kind?0:a.kind==='fixo'?-1:1)||a.desc.localeCompare(b.desc));
}
function nextRec(t){const td=today();const c=S.cash.filter(x=>x.recurringId===t.id&&x.date>=td&&x.status!=='pago').sort((a,b)=>a.date.localeCompare(b.date))[0];return c}

   <div class="row" style="margin-top:10px"><span class="sp"></span><button class="btn pri" id="sgok">Criar recorrentes selecionados</button></div></section>`:''}
  ${S.recurring.length?`<div class="scroll"><table class="stack"><thead><tr><th>Gasto</th><th>Tipo</th><th class="num">Valor</th><th>Dia</th><th>Próximo</th><th>Ativo</th><th></th></tr></thead><tbody>${S.recurring.map(t=>{const nx=nextRec(t);return `<tr data-id="${t.id}"><td><b>${esc(t.desc)}</b><div class="muted small">${esc([t.cc,t.account].filter(Boolean).join(' · '))}</div></td><td><span class="tag ${t.kind==='fixo'?'dark':'or'}">${t.kind==='fixo'?'Fixo':'Variável'}</span></td><td class="num">${t.kind==='fixo'?brl(t.value):'≈ '+brl(recEstimate(t))+'<div class="muted small">média de 3 meses</div>'}</td><td>${t.day||'—'}</td><td class="nw">${nx?fdate(nx.date):'—'}</td><td><input type="checkbox" data-act ${t.active!==false?'checked':''} aria-label="Ativo"></td><td class="num nw"><button class="ib" data-red aria-label="Editar">${ic('edit')}</button><button class="ib" data-rrm aria-label="Excluir">${ic('trash')}</button></td></tr>`}).join('')}</tbody></table></div>`:(!sug.length?'<div class="empty">Nenhum gasto recorrente ainda. Crie um em "Novo recorrente".</div>':'')}
  <div class="row"><span class="sp"></span><button class="btn" data-close>Fechar</button></div>`,{wide:true});
 const done=msg=>{const n=runRecurring();save('recurring');toast(msg+(n?` ${n} lançamento(s) criados nos próximos meses.`:''));recurringManager();route()};
 $('#rah').onchange=e=>{S.settings.recAhead=+e.target.value;save('settings');done('Antecedência salva.')};
 $('#rnew').onclick=()=>recForm();
 if(sug.length)$('#sgok').onclick=()=>{const now=new Date();const st=ymOf(now.getFullYear(),now.getMonth());$$('[data-sg]',m).forEach(c=>{if(!c.checked)return;const s=sug[+c.dataset.sg];S.recurring.push({id:uid(),key:s.key,desc:s.desc,company:s.company,account:s.account,cc:s.cc,costType:s.costType,dre:s.dre,day:s.day,kind:s.kind,value:s.value,active:true,start:st,skip:[]})});done('Recorrentes criados.')};
 const tOf=el=>S.recurring.find(t=>t.id===el.closest('tr').dataset.id);
 $$('[data-act]',m).forEach(c=>c.onchange=()=>{tOf(c).active=c.checked;if(!c.checked)removeFutureRec(tOf(c));done(c.checked?'Recorrente ativado.':'Recorrente pausado: lançamentos futuros "a pagar" removidos.')});

}

function recForm(t){

 const f=m.querySelector('form');const h=()=>{const v=f.kind.value==='variavel';f.value.disabled=v;$('#rfh').textContent=v?'O valor de cada mês será a média dos 3 últimos pagamentos com essa descrição. Quando a fatura chegar, troque pelo valor real no lançamento.':'Mudar o valor aqui atualiza os lançamentos futuros ainda "a pagar".'};h();f.kind.onchange=h;

 f.onsubmit=e=>{e.preventDefault();const d=formData(f);d.value=num(d.value);d.day=Math.max(1,Math.min(31,+d.day||5));
  if(d.kind==='fixo'&&!d.value){toast('Informe o valor fixo.');return}
  Object.assign(t,d);t.key=recKey(t.desc,t.account);if(isNew){t.id=uid();t.skip=[];S.recurring=S.recurring||[];S.recurring.push(t)}
  const td=today();S.cash.forEach(c=>{if(c.recurringId===t.id&&c.date>=td&&c.status!=='pago'){c.desc=t.desc;c.company=t.company;c.cc=t.cc;c.account=t.account;c.dre=t.dre;const last=new Date(+c.date.slice(0,4),+c.date.slice(5,7),0).getDate();c.date=c.date.slice(0,8)+String(Math.min(t.day,last)).padStart(2,'0');if(t.kind==='fixo'){c.value=t.value;c.est=false}else c.est=true}});
  if(t.end)S.cash=S.cash.filter(c=>!(c.recurringId===t.id&&c.date.slice(0,7)>t.end&&c.status!=='pago'));

let PENDING=[];

 if(!r.error)PENDING=r.data||[];

const pendingOf=kind=>PENDING.filter(p=>p.kind===kind);
function signupBase(){return /^https?:$/.test(location.protocol)?new URL('cadastro.html',location.href).href.split('?')[0].split('#')[0]:'https://lrrdac-create.github.io/gr-eventos-sistem/cadastro.html'}
async function signupToken(kind,renew){
 if(renew){const r=await sb.from('signup_links').upsert({kind,token:crypto.randomUUID(),created_at:new Date().toISOString()}).select('token').single();if(r.error)throw r.error;return r.data.token}
 let r=await sb.from('signup_links').select('token').eq('kind',kind).maybeSingle();
 if(r.error)throw r.error;if(r.data)return r.data.token;

const digits=s=>String(s||'').replace(/\D/g,'');
function signupMatch(req){

function md(s){const lines=String(s||'').split('\n');let h='',inL=false,tb=null;
 const flushT=()=>{if(tb){h+=`<div class="scroll"><table class="mdt"><thead><tr>${tb[0].map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${tb.slice(1).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;tb=null}};
 for(const raw of lines){const l=raw.trimEnd();
  if(/^\s*\|/.test(l)){if(inL){h+='</ul>';inL=false}const cells=l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());if(cells.every(c=>/^:?-+:?$/.test(c)))continue;(tb=tb||[]).push(cells);continue}
  flushT();
  if(/^\s*[-•]\s+/.test(l)){if(!inL){h+='<ul>';inL=true}h+=`<li>${esc(l.replace(/^\s*[-•]\s+/,''))}</li>`;continue}
  if(inL){h+='</ul>';inL=false}
  if(/^##?\s+/.test(l))h+=`<h2>${esc(l.replace(/^##?\s+/,''))}</h2>`;else if(/^>\s*/.test(l))h+=`<blockquote>${esc(l.replace(/^>\s*/,''))}</blockquote>`;else if(l.trim())h+=`<p>${esc(l)}</p>`}
 flushT();if(inL)h+='</ul>';return h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}

 if(!sbInit()){$('#root').innerHTML='<div style="display:grid;place-items:center;min-height:100vh;padding:24px;text-align:center;color:#8C8273">Não foi possível carregar a nuvem.<br>Verifique a conexão e recarregue a página.</div>';return}
 const s=(await sb.auth.getSession()).data.session;
 if(s)await startSession();else renderLogin();
 if('serviceWorker'in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
 window.addEventListener('focus',()=>cloudReload(true));
 setInterval(()=>{if(!document.hidden)cloudReload(true)},60000);
})();
}
</script>
</body>
